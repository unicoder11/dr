name: dr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: desafios_reais
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr -d desafios_reais"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  dr-api:
    build: .
    image: dr-api:local
    container_name: dr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      API_ADDR: :8080
      DATABASE_URL: postgres://dr:${POSTGRES_PASSWORD}@postgres:5432/desafios_reais?sslmode=disable
      MEDIA_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dr-api
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
